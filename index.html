<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚽ Tripulación Enterprise · Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --surface: #1a2035;
  --surface2: #232d45;
  --border: #2a3555;
  --gold: #f5c842;
  --gold2: #ffd966;
  --green: #00c853;
  --red: #ff3d57;
  --blue: #3d8bff;
  --text: #f0f4ff;
  --muted: #6b7a99;
  --radius: 14px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ── STARS BACKGROUND ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at 20% 50%, rgba(61,139,255,0.06) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(245,200,66,0.05) 0%, transparent 50%),
              radial-gradient(ellipse at 60% 80%, rgba(0,200,83,0.04) 0%, transparent 50%);
}

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: var(--bg); display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; gap: 1.5rem;
}
.loading-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--gold); letter-spacing: 3px; }
.loading-ship { font-size: 3rem; animation: float 1.5s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-12px) rotate(5deg); } }
.loading-bar { width: 200px; height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
.loading-bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); animation: load 1.5s ease-in-out infinite; border-radius: 99px; }
@keyframes load { 0%{width:0%} 50%{width:80%} 100%{width:100%} }

/* ── LOGIN ── */
#login-screen {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: var(--bg); z-index: 100; padding: 1.5rem; overflow-y: auto;
}
.login-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
  padding: 2rem 1.5rem; width: 100%; max-width: 420px;
  box-shadow: 0 0 80px rgba(61,139,255,0.15), 0 30px 60px rgba(0,0,0,0.5);
}
.login-header { text-align: center; margin-bottom: 1.75rem; }
.login-ship { font-size: 3rem; margin-bottom: 6px; }
.login-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--gold); letter-spacing: 3px; line-height: 1; }
.login-sub { font-size: 0.78rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.5px; }
.login-label { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
.member-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 1.25rem; }
.member-btn {
  padding: 11px 8px; border-radius: 10px; border: 1.5px solid var(--border);
  font-size: 0.88rem; font-weight: 600; cursor: pointer; background: var(--bg2);
  color: var(--text); transition: all 0.15s; text-align: center;
}
.member-btn:hover { border-color: var(--blue); color: var(--gold); background: rgba(61,139,255,0.08); }
.member-btn.selected { border-color: var(--gold); background: rgba(245,200,66,0.12); color: var(--gold); box-shadow: 0 0 16px rgba(245,200,66,0.2); }
.login-enter {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #f5c842, #e6a800);
  border: none; border-radius: 12px; font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem; letter-spacing: 2px; color: #0a0e1a; cursor: pointer;
  transition: all 0.15s; box-shadow: 0 4px 20px rgba(245,200,66,0.3);
}
.login-enter:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245,200,66,0.4); }
.login-enter:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; box-shadow: none; transform: none; }

/* ── APP ── */
#app { display: none; position: relative; z-index: 1; }

/* ── HEADER ── */
.app-header {
  background: rgba(10,14,26,0.95); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); padding: 0.85rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-ship { font-size: 1.4rem; }
.header-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gold); letter-spacing: 2px; line-height: 1; }
.header-sub { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.user-pill {
  display: flex; align-items: center; gap: 7px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px;
  cursor: pointer; transition: all 0.15s;
}
.user-pill:hover { border-color: var(--gold); }
.user-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.user-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
.user-change { font-size: 0.6rem; color: var(--muted); }

/* ── SYNC ── */
.sync-bar { background: var(--bg); padding: 3px 1.25rem; font-size: 0.62rem; color: var(--muted); text-align: right; border-bottom: 1px solid var(--border); }
.sync-bar.syncing { color: var(--gold); }
.sync-bar.error   { color: var(--red); }

/* ── SCOREBOARD ── */
.scoreboard-section { background: linear-gradient(135deg, var(--bg2), var(--surface)); border-bottom: 1px solid var(--border); padding: 1rem 1rem 1.1rem; }
.section-label { font-size: 0.62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.75rem; }
.scores-scroll { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.scores-scroll::-webkit-scrollbar { display: none; }
.score-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
  padding: 0.65rem 0.75rem; text-align: center; min-width: 68px; flex-shrink: 0;
  position: relative; transition: all 0.2s;
}
.score-card.me    { border-color: var(--gold); background: rgba(245,200,66,0.1); box-shadow: 0 0 20px rgba(245,200,66,0.15); }
.score-card.top1  { border-color: var(--green); }
.score-medal { position: absolute; top: 3px; right: 5px; font-size: 0.7rem; }
.score-name { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
.score-pts  { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; color: var(--text); line-height: 1; }
.score-pts.gold { color: var(--gold); }
.score-lbl  { font-size: 0.55rem; color: var(--muted); }

/* ── MAIN ── */
.main { max-width: 600px; margin: 0 auto; padding: 1.25rem 0.9rem 5rem; }

/* ── TABS ── */
.tabs-wrap {
  display: flex; gap: 3px; margin-bottom: 1.25rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 4px; overflow-x: auto; scrollbar-width: none;
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 7px 10px; border-radius: 99px; font-size: 0.68rem; font-weight: 700;
  cursor: pointer; border: none; background: transparent; color: var(--muted);
  transition: all 0.15s; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
}
.tab.active { background: var(--gold); color: #0a0e1a; box-shadow: 0 2px 12px rgba(245,200,66,0.3); }
.tab:hover:not(.active) { color: var(--text); }
.phase-panel { display: none; }
.phase-panel.active { display: block; }

/* ── DATE DIVIDER ── */
.date-divider { display: flex; align-items: center; gap: 10px; margin: 1rem 0 0.6rem; }
.date-line { flex: 1; height: 1px; background: var(--border); }
.date-label {
  font-size: 0.68rem; font-weight: 700; color: var(--gold); text-transform: uppercase;
  letter-spacing: 1px; white-space: nowrap; padding: 0 4px;
}

/* ── MATCH CARD ── */
.match-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: border-color 0.2s, box-shadow 0.2s;
}
.match-card:hover { border-color: var(--surface2); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.match-card.has-result { border-color: rgba(0,200,83,0.3); }

.match-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px 0; font-size: 0.62rem;
}
.match-group-badge {
  background: var(--gold); color: #0a0e1a; font-size: 0.58rem; font-weight: 800;
  padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.5px;
}
.match-times { display: flex; gap: 8px; }
.match-time-item { font-size: 0.6rem; color: var(--muted); }
.match-time-item span { color: var(--text); font-weight: 600; }

/* Teams */
.teams-row {
  display: grid; grid-template-columns: 1fr 44px 1fr; gap: 6px;
  align-items: center; padding: 10px 14px 4px;
}
.team-block { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.team-flag  { font-size: 1.8rem; line-height: 1; }
.team-name  { font-size: 0.78rem; font-weight: 700; color: var(--text); text-align: center; line-height: 1.2; }
.vs-orb {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; font-weight: 800; color: var(--muted); flex-shrink: 0;
}
.vs-orb.done { background: rgba(0,200,83,0.15); border-color: var(--green); color: var(--green); font-size: 1rem; font-weight: 900; }

/* Result row */
.result-row {
  display: grid; grid-template-columns: 1fr 52px 1fr; gap: 6px; padding: 5px 14px 10px;
}
.res-btn {
  padding: 8px 4px; border-radius: 9px; border: 1.5px solid var(--border);
  font-size: 0.72rem; font-weight: 700; cursor: pointer; background: var(--bg2);
  color: var(--muted); transition: all 0.12s; font-family: 'Inter', sans-serif; text-align: center;
}
.res-btn:hover:not([disabled]):not(.readonly) { border-color: var(--blue); color: var(--text); }
.res-btn.active-1 { background: rgba(0,200,83,0.15); border-color: var(--green); color: var(--green); }
.res-btn.active-2 { background: rgba(255,61,87,0.15); border-color: var(--red); color: var(--red); }
.res-btn-empate {
  padding: 8px 4px; border-radius: 9px; border: 1.5px solid var(--border);
  font-size: 0.62rem; font-weight: 700; cursor: pointer; background: var(--bg2);
  color: var(--muted); transition: all 0.12s; font-family: 'Inter', sans-serif; text-align: center; line-height: 1.3;
}
.res-btn-empate:hover:not([disabled]):not(.readonly) { border-color: var(--blue); color: var(--text); }
.res-btn-empate.active-X { background: rgba(61,139,255,0.15); border-color: var(--blue); color: var(--blue); }
.readonly { cursor: default !important; }

/* Predictions */
.preds-area { border-top: 1px solid var(--border); padding: 10px 14px 12px; background: rgba(0,0,0,0.2); }
.preds-title { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.preds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 5px; }
.pred-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: var(--surface2); border-radius: 9px; padding: 7px 4px;
  border: 1.5px solid var(--border); transition: all 0.12s; position: relative;
}
.pred-item.is-me   { border-color: var(--gold); background: rgba(245,200,66,0.08); }
.pred-item.correct { border-color: var(--green); background: rgba(0,200,83,0.08); }
.pred-name { font-size: 0.58rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.2px; text-align: center; }
.pred-name.me { color: var(--gold); }
.pred-btn {
  width: 100%; padding: 5px 2px; border-radius: 6px; border: 1.5px solid var(--border);
  font-size: 0.85rem; cursor: pointer; background: var(--bg); color: var(--muted);
  transition: all 0.12s; font-family: 'Inter', sans-serif; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1;
}
.pred-btn .pi { font-size: 0.95rem; }
.pred-btn .pl { font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2px; }
.pred-btn.sel-1 { background: rgba(0,200,83,0.15); border-color: var(--green); color: var(--green); }
.pred-btn.sel-X { background: rgba(61,139,255,0.15); border-color: var(--blue); color: var(--blue); }
.pred-btn.sel-2 { background: rgba(255,61,87,0.15); border-color: var(--red); color: var(--red); }
.pred-btn.readonly { cursor: default; opacity: 0.7; }
.pred-pts { font-size: 0.6rem; font-weight: 800; color: transparent; height: 12px; }
.pred-pts.earned { color: var(--green); }
.star-badge { position: absolute; top: -5px; right: -5px; font-size: 0.7rem; }

/* ── MEDALLERO ── */
.medallero-wrap { padding: 0.25rem 0 1rem; }
.med-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--gold); text-align: center; letter-spacing: 3px; margin-bottom: 4px; }
.med-sub { text-align: center; font-size: 0.7rem; color: var(--muted); margin-bottom: 1.5rem; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-bottom: 1.25rem; padding: 0 4px; }
.podium-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; max-width: 120px; }
.pod-avatar {
  width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
  color: #0a0e1a; box-shadow: 0 4px 16px rgba(0,0,0,0.4); border: 3px solid rgba(255,255,255,0.1);
}
.pod-name { font-size: 0.72rem; font-weight: 700; color: var(--text); text-align: center; }
.pod-pts  { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold); line-height: 1; }
.pod-base {
  width: 100%; border-radius: 8px 8px 0 0; display: flex; align-items: center;
  justify-content: center; font-size: 1.6rem;
}
.pod-base-1 { height: 80px; background: linear-gradient(160deg,#f5c842,#e6a800); }
.pod-base-2 { height: 55px; background: linear-gradient(160deg,#8e9eab,#b0bec5); }
.pod-base-3 { height: 38px; background: linear-gradient(160deg,#c97b44,#e6a96a); }
.med-waiting { text-align: center; padding: 3rem 1rem; }
.med-waiting-icon { font-size: 3rem; margin-bottom: 0.75rem; }
.med-waiting-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 2px; }
.med-waiting-sub { font-size: 0.8rem; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.rest-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
.rest-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.rest-item:last-child { border-bottom: none; }
.rest-item.is-me { background: rgba(245,200,66,0.06); }
.rest-rank { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--muted); width: 22px; text-align: center; }
.rest-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; color: #0a0e1a; flex-shrink: 0; }
.rest-name { flex: 1; font-size: 0.85rem; font-weight: 600; color: var(--text); }
.rest-pts { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--gold); }
.rest-lbl { font-size: 0.58rem; color: var(--muted); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.stat-lbl { font-size: 0.62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--text); line-height: 1.1; margin-top: 2px; }
.stat-sub { font-size: 0.68rem; color: var(--muted); }

/* ── HOY ── */
.hoy-hero {
  border-radius: var(--radius); padding: 1.5rem 1.25rem; margin-bottom: 1rem;
  background: linear-gradient(135deg, #0d1b3e, #1a2d5a, #0d2b1a);
  border: 1px solid var(--border); position: relative; overflow: hidden; text-align: center;
}
.hoy-hero::before { content: "🚀"; position: absolute; font-size: 7rem; opacity: 0.05; top: -10px; right: -10px; }
.hoy-fecha { font-size: 0.68rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; }
.hoy-count { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--text); line-height: 1.1; margin: 4px 0; }
.hoy-count span { color: var(--gold); }
.hoy-teams { font-size: 0.72rem; color: var(--muted); }
.aliento-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem 1.25rem; margin-bottom: 1rem; display: flex; gap: 12px; align-items: flex-start;
}
.aliento-icon { font-size: 1.6rem; flex-shrink: 0; }
.aliento-text { font-size: 0.86rem; font-weight: 500; color: var(--text); line-height: 1.55; }
.aliento-text.loading { color: var(--muted); font-style: italic; }
.curiosidad-card {
  background: linear-gradient(135deg, rgba(245,200,66,0.05), rgba(245,200,66,0.02));
  border: 1px solid rgba(245,200,66,0.2); border-radius: var(--radius);
  padding: 1rem 1.25rem; margin-bottom: 1.25rem;
}
.curi-header { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.curi-icon { font-size: 1.1rem; }
.curi-label { font-size: 0.62rem; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
.curi-text { font-size: 0.83rem; color: var(--text); line-height: 1.55; }
.curi-text.loading { color: var(--muted); font-style: italic; }
.hoy-empty { text-align: center; padding: 3rem 1rem; }
.hoy-empty-icon { font-size: 3rem; margin-bottom: 0.75rem; }
.hoy-empty-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold); letter-spacing: 2px; }
.hoy-empty-sub { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

/* Phase totals */
.phase-totals { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-top: 6px; }
.pt-title { font-size: 0.62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.pt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.pt-item { text-align: center; padding: 7px 4px; border-radius: 9px; background: var(--bg2); }
.pt-item.me { background: rgba(245,200,66,0.1); border: 1px solid rgba(245,200,66,0.2); }
.pt-name { font-size: 0.58rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.pt-name.me { color: var(--gold); }
.pt-pts  { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--text); }
.pt-pts.me { color: var(--gold); }

/* ── LOCKED PRED ── */
.pred-btn.locked {
  cursor: not-allowed !important;
  opacity: 0.5;
  border-style: dashed;
}
.pred-btn.locked:hover { border-color: var(--border) !important; }
.match-card.started .match-header::after {
  content: "🔒 Cerrado";
  font-size: 0.6rem; font-weight: 800; color: var(--red);
  background: rgba(255,61,87,0.12); border: 1px solid rgba(255,61,87,0.3);
  border-radius: 99px; padding: 2px 8px; margin-left: auto;
}
.lock-notice {
  font-size: 0.62rem; color: var(--red); font-weight: 700;
  text-align: center; padding: 4px 0 8px; letter-spacing: 0.3px;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 12px 22px; border-radius: 99px; font-size: 0.85rem; font-weight: 600;
  z-index: 9998; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap;

function buildResBtns(phId, mi, real, lo, vi) {
  const admin = isAdmin();
  const cls = (v) => real===v ? (v==='1'?'active-1':v==='X'?'active-X':'active-2') : '';
  const tog = (v) => real===v ? '' : v;
  const ro  = admin ? '' : 'readonly';
  const cl  = admin ? `onclick="window.setReal('${phId}',${mi},'${tog('1')}')"` : '';
  const cx  = admin ? `onclick="window.setReal('${phId}',${mi},'${tog('X')}')"` : '';
  const cv  = admin ? `onclick="window.setReal('${phId}',${mi},'${tog('2')}')"` : '';
  return `
    <button class="res-btn ${cls('1')} ${ro}" ${cl}>${F(lo)} Gana</button>
    <button class="res-btn-empate ${cls('X')} ${ro}" ${cx}>🤝<br>Empate</button>
    <button class="res-btn ${cls('2')} ${ro}" ${cv}>${F(vi)} Gana</button>`;
}


function predsHtml(phId, mi, real, preds, lo, vi, match) {
  const locked = matchStarted(match) && !isAdmin();
  return MEMBERS.map(n => {
    const v = preds?.[n] || "";
    const isMe = n === me;
    const correct = real && v && real===v;
    const pts = correct ? `+${PTS}` : "";
    const icon = v==="1" ? F(lo) : v==="X" ? "🤝" : v==="2" ? F(vi) : "❓";
    const lbl  = v==="1" ? lo.substring(0,7) : v==="X" ? "Empate" : v==="2" ? vi.substring(0,7) : "Elegir";
    const inner = `<span class="pi">${icon}</span><span class="pl">${lbl}</span>`;
    if (isMe) {
      const canClick = !locked;
      return `<div class="pred-item is-me ${correct?'correct':''}">
        ${correct?'<span class="star-badge">⭐</span>':''}
        <div class="pred-name me">${n}</div>
        <button class="pred-btn ${v?'sel-'+v:''} ${locked?'locked':''}"
          ${canClick?`onclick="window.cyclePred('${phId}',${mi})"`:''} 
          ${locked?'title="Partido en curso — pronóstico cerrado"':''}>${inner}</button>
        <div class="pred-pts ${correct?'earned':''}">${pts||" "}</div>
      </div>`;
    } else {
      return `<div class="pred-item ${correct?'correct':''}">
        ${correct?'<span class="star-badge">⭐</span>':''}
        <div class="pred-name">${n.split(' ')[0].substring(0,8)}</div>
        <div class="pred-btn readonly ${v?'sel-'+v:''}" style="${!v?'opacity:0.2;border-style:dashed':''}">${v?inner:'<span class="pi">·</span>'}</div>
        <div class="pred-pts ${correct?'earned':''}">${pts||" "}</div>
      </div>`;
    }
  }).join("");
}

function matchCardHtml(phId, match, mi) {
  const mData   = getMData(phId, mi);
  const real    = mData.real || "";
  const preds   = mData.preds || {};
  const lo      = match.l, vi = match.v;
  const started = matchStarted(match);
  const gLabel  = match.g ? `<span class="match-group-badge">Grupo ${match.g}</span>` : `<span class="match-group-badge">${phId.toUpperCase()}</span>`;
  return `<div class="match-card ${real?'has-result':''} ${started?'started':''}">
    <div class="match-header">
      ${gLabel}
      <div class="match-times"><span class="match-time-item">${fmtTimes(match)}</span></div>
    </div>
    <div class="teams-row">
      <div class="team-block"><div class="team-flag">${F(lo)}</div><div class="team-name">${lo}</div></div>
      <div class="vs-orb ${real?'done':''}">${real==='X'?'🤝':real||'VS'}</div>
      <div class="team-block"><div class="team-flag">${F(vi)}</div><div class="team-name">${vi}</div></div>
    </div>
    <div class="result-row">${buildResBtns(phId, mi, real, lo, vi)}</div>
    <div class="preds-area">
      <div class="preds-title">⚡ Pronósticos de la tripulación</div>
      ${started ? '<div class="lock-notice">🔒 Partido iniciado · pronósticos cerrados</div>' : ''}
      <div class="preds-grid">${predsHtml(phId, mi, real, preds, lo, vi, match)}</div>
    </div>
  </div>`;
}

async function callClaude(system, user, fallback) {
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 180,
        system,
        messages: [{ role: "user", content: user }]
      })
    });
    const d = await r.json();
    return d.content?.[0]?.text || fallback;
  } catch(e) { return fallback; }
}

async function loadAI(todayMatches, today) {
  const matchList = todayMatches.map(({m}) => `${m.l} vs ${m.v}`).join(", ");
  const allTeams  = [...new Set(todayMatches.flatMap(({m}) => [m.l, m.v]))];

  // Pick a random team pair to focus curiosity on
  const focusIdx   = Math.floor(Math.random() * todayMatches.length);
  const focusMatch = todayMatches[focusIdx].m;
  const focusTeams = `${focusMatch.l} vs ${focusMatch.v}`;

  // Random personality styles for aliento — so it's never the same
  const styles = [
    "Hablas como cuate mexicano irreverente, con humor negro y albures suaves. Nada de emojis.",
    "Hablas como comentarista deportivo exagerado y dramático, estilo narrador de gol. Nada de emojis.",
    "Hablas como el tío borracho del partido que sabe de fut pero no para de reírse. Nada de emojis.",
    "Hablas como estratega militar que convierte el fut en una misión espacial de vida o muerte. Nada de emojis.",
    "Hablas como filósofo que mezcla Nietzsche con fut de barrio. Nada de emojis.",
    "Hablas como el más nerd del grupo que calcula probabilidades pero con mucho corazón. Nada de emojis.",
  ];
  const style = styles[Math.floor(Math.random() * styles.length)];

  // Random curiosity angles — so the data always sorprises
  const angles = [
    `Un récord Mundial absurdo o vergonzoso de ${focusMatch.l} o ${focusMatch.v} que nadie recuerda.`,
    `Un dato estadístico extraño o improbable del partido ${focusTeams} en la historia del Mundial.`,
    `Una anécdota bizarra o increíble sobre algún jugador histórico de ${focusMatch.l} o ${focusMatch.v}.`,
    `Cuánto dinero, poder o locura hay detrás de ${focusMatch.l} o ${focusMatch.v} como selección.`,
    `Una predicción absurda que se cumplió o no se cumplió sobre ${focusMatch.l} o ${focusMatch.v}.`,
    `El partido más loco en la historia entre selecciones similares a las de hoy: ${matchList}.`,
  ];
  const angle = angles[Math.floor(Math.random() * angles.length)];

  // Run both in parallel
  const [aliento, curiosidad] = await Promise.all([
    callClaude(
      `Eres el capitán de la Tripulación Enterprise, quiniela de carnales del Mundial 2026. ${style} Máximo 2 oraciones contundentes.`,
      `Hoy juegan: ${matchList}. El tripulante es ${me}. Escríbele algo que lo obligue a poner su pronóstico AHORA. Menciona su nombre. Sorpréndelo.`,
      `¡${me}, ya todos pusieron su pronóstico menos tú! No seas el del grupo que siempre llega tarde.`
    ),
    callClaude(
      `Eres el oráculo de datos futbolísticos de la Tripulación Enterprise. Respondes en español. Sin emojis. Máximo 2 oraciones. El dato debe ser tan sorprendente que la gente diga "no puede ser".`,
      `${angle} Que sea un dato real, verificable, que deje con el ojo cuadrado. 2 oraciones máximo.`,
      `${focusMatch.l} y ${focusMatch.v} juntos han jugado en Mundiales donde nadie apostaba por ellos — y uno de los dos siempre termina sorprendiendo.`
    )
  ]);

  const el1 = document.getElementById("aliento-text");
  const el2 = document.getElementById("curi-text");
  if (el1) { el1.textContent = aliento;   el1.classList.remove("loading"); }
  if (el2) { el2.textContent = curiosidad; el2.classList.remove("loading"); }
}

function renderMedallero() {
  const panel = document.getElementById("panel-med");
  if (!panel) return;
  let totalJugados = 0, totalAciertos = 0;
  PHASES.forEach(ph => ph.matches.forEach((_,mi) => {
    const m = getMData(ph.id,mi);
    if (m.real) { totalJugados++; MEMBERS.forEach(n => { if(m.preds?.[n]===m.real) totalAciertos++; }); }
  }));

  if (!totalJugados) {
    panel.innerHTML = `<div class="medallero-wrap">
      <div class="med-title">Medallero</div>
      <div class="med-waiting">
        <div class="med-waiting-icon">⏳</div>
        <div class="med-waiting-title">Esperando el Pitazo</div>
        <div class="med-waiting-sub">El medallero aparece cuando Rafa<br>registre el primer resultado real.</div>
      </div></div>`;
    return;
  }

  const pts = getAllPts();
  const sorted = pts.map((v,i)=>({v,i,n:MEMBERS[i]})).sort((a,b)=>b.v-a.v);
  const top = sorted.slice(0,3);
  const order = top.length>=3 ? [top[1],top[0],top[2]] : top.length===2 ? [top[1],top[0]] : [top[0]];
  const bases = ["pod-base-2","pod-base-1","pod-base-3"];
  const emojis = ["🥈","🥇","🥉"];

  const podHtml = order.map((p,vi) => {
    if(!p) return "";
    const isMe = p.n===me;
    const av = `<div class="pod-avatar" style="background:${COLORS[p.i]};${isMe?'box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(245,200,66,0.3)':''}">${p.n[0].toUpperCase()}</div>`;
    return `<div class="podium-slot">${av}
      <div class="pod-name">${p.n.split(' ')[0]}${isMe?' 👈':''}</div>
      <div class="pod-pts">${p.v}</div>
      <div class="pod-base ${bases[vi]}">${emojis[vi]}</div>
    </div>`;
  }).join("");

  const restHtml = sorted.slice(3).map((p,ri) => {
    const isMe = p.n===me;
    return `<div class="rest-item ${isMe?'is-me':''}">
      <div class="rest-rank">${ri+4}</div>
      <div class="rest-avatar" style="background:${COLORS[p.i]}">${p.n[0].toUpperCase()}</div>
      <div class="rest-name">${p.n}${isMe?' 👈':''}</div>
      <div><div class="rest-pts">${p.v}</div><div class="rest-lbl">pts</div></div>
    </div>`;
  }).join("");

  const myRank = sorted.findIndex(s=>s.n===me)+1;
  const myPts  = pts[MEMBERS.indexOf(me)];
  const leader = sorted[0];
  const diff   = leader.v - myPts;

  panel.innerHTML = `<div class="medallero-wrap">
    <div class="med-title">Medallero</div>
    <div class="med-sub">Basado en ${totalJugados} partido${totalJugados!==1?'s':''} jugado${totalJugados!==1?'s':''}</div>
    <div class="podium">${podHtml}</div>
    ${sorted.length>3?`<div class="rest-list">${restHtml}</div>`:''}
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-lbl">Tu posición</div><div class="stat-val">#${myRank}</div><div class="stat-sub">de ${MEMBERS.length} tripulantes</div></div>
      <div class="stat-card"><div class="stat-lbl">${diff===0?'¡Vas primero!':'Al líder te faltan'}</div><div class="stat-val">${diff===0?myPts+' pts':diff+' pts'}</div><div class="stat-sub">${diff===0?'Sigue así 🚀':leader.n+' lleva '+leader.v}</div></div>
      <div class="stat-card"><div class="stat-lbl">Partidos jugados</div><div class="stat-val">${totalJugados}</div><div class="stat-sub">de ${PHASES.reduce((a,ph)=>a+ph.matches.length,0)} totales</div></div>
      <div class="stat-card"><div class="stat-lbl">Aciertos tripulación</div><div class="stat-val">${totalAciertos}</div><div class="stat-sub">entre todos 🎯</div></div>
    </div>
  </div>`;
}

let firstLoad = true;
function revealApp() {
  if (!firstLoad) return;
  firstLoad = false;
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";

function subscribeDb() {
  // Fallback: show app after 5s even if Firebase is slow
  setTimeout(revealApp, 5000);
  const dbRef = db.ref("quiniela");
  dbRef.on("value", snap => {
    dbState = snap.val()||{};
    revealApp();
    renderAll();
    setSyncStatus("online");
  }, (err) => {
    setSyncStatus("error");
    revealApp();
  });
  unsub = () => dbRef.off();
}

function setSyncStatus(s) {
  const b = document.getElementById("sync-bar");
  if(s==="online")  { b.textContent="● En línea · tiempo real"; b.className="sync-bar"; }
  if(s==="syncing") { b.textContent="↑ Guardando..."; b.className="sync-bar syncing"; }
  if(s==="error")   { b.textContent="✕ Sin conexión"; b.className="sync-bar error"; }
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
window.cyclePred = (phId, mi) => {
  // Find match to check if started
  const ph = PHASES.find(p=>p.id===phId);
  // Only block non-admins when match has started
  if (ph && matchStarted(ph.matches[mi]) && !isAdmin()) return;
  const cur = getMData(phId,mi).preds?.[me] || "";
  const cycle = ["1","X","2",""];
  const next  = cycle[(cycle.indexOf(cur)+1)%cycle.length];
  setSyncStatus("syncing");
  db.ref(`quiniela/${phId}/${mi}/preds/${me}`).set(next||null)
    .then(()=>{
      setSyncStatus("online");
      const real = getMData(phId,mi).real;
      if(real && next && real===next) { confetti(); showToast(`¡Acierto! 🚀 +${PTS} pts`); }
    }).catch(()=>setSyncStatus("error"));
};

window.setReal = (phId, mi, val) => {
  if(!isAdmin()) return;
  setSyncStatus("syncing");
  db.ref(`quiniela/${phId}/${mi}/real`).set(val||null)
    .then(()=>{
      setSyncStatus("online");
      if(val) {
        const preds = getMData(phId,mi).preds||{};
        const winners = MEMBERS.filter(n=>preds[n]===val);
        if(winners.length) { confetti(); showToast(`¡${winners.map(n=>n.split(' ')[0]).join(', ')} acertó! ⭐`); }
      }
    }).catch(()=>setSyncStatus("error"));
};

// ── PIN LOGIC ──
let pinBuffer = "";
let pendingUser = null;

window.showPinScreen = () => {
  const sel = document.querySelector(".member-btn.selected");
  if (!sel) return;
  pendingUser = sel.dataset.name;
  pinBuffer = "";
  pinAttempts = 0;
  document.getElementById("pin-who").textContent = `PIN de ${pendingUser}`;
  document.getElementById("pin-error").textContent = "";
  updatePinDots();
  document.getElementById("member-grid").style.display = "none";
  document.getElementById("login-btn").style.display = "none";
  document.getElementById("pin-screen").style.display = "flex";
};

window.hidePinScreen = () => {
  document.getElementById("pin-screen").style.display = "none";
  document.getElementById("member-grid").style.display = "grid";
  document.getElementById("login-btn").style.display = "block";
  pinBuffer = "";
  updatePinDots();
};

window.pinKey = (digit) => {
  if (pinBlocked || pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updatePinDots();
  if (pinBuffer.length === 4) validatePin();
};

window.pinDel = () => {
  if (pinBlocked) return;
  pinBuffer = pinBuffer.slice(0,-1);
  updatePinDots();
  document.getElementById("pin-error").textContent = "";
};

function updatePinDots() {
  for (let i=0; i<4; i++) {
    const dot = document.getElementById("pd"+i);
    dot.className = "pin-dot" + (i < pinBuffer.length ? " filled" : "");
  }
}

function validatePin() {
  if (PINS[pendingUser] === pinBuffer) {
    // Correct!
    me = pendingUser;
    localStorage.setItem("qe_user", me);
    // Store hashed session so we don't ask again this session
    sessionStorage.setItem("qe_auth", me);
    showApp();
  } else {
    pinAttempts++;
    // Shake dots red
    for (let i=0; i<4; i++) document.getElementById("pd"+i).className = "pin-dot error";
    setTimeout(() => { pinBuffer = ""; updatePinDots(); }, 600);

    if (pinAttempts >= 3) {
      pinBlocked = true;
      let secs = 30;
      const errEl = document.getElementById("pin-error");
      errEl.textContent = `Demasiados intentos. Espera ${secs}s...`;
      const interval = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(interval);
          pinBlocked = false;
          pinAttempts = 0;
          errEl.textContent = "";
        } else {
          errEl.textContent = `Demasiados intentos. Espera ${secs}s...`;
        }
      }, 1000);
    } else {
      document.getElementById("pin-error").textContent =
        `PIN incorrecto · ${3 - pinAttempts} intento${3-pinAttempts!==1?'s':''} restante${3-pinAttempts!==1?'s':''}`;
    }
  }
}

window.doLogin = () => {}; // handled by showPinScreen now

window.logout = () => {
  localStorage.removeItem("qe_user");
  sessionStorage.removeItem("qe_auth");
  me = null; if(unsub){unsub();unsub=null;}
  document.getElementById("app").style.display="none";
  document.getElementById("login-screen").style.display="flex";
  // Reset to member selection screen
  document.getElementById("pin-screen").style.display="none";
  document.getElementById("member-grid").style.display="grid";
  document.getElementById("login-btn").style.display="block";
  document.querySelectorAll(".member-btn").forEach(b=>b.classList.remove("selected"));
  document.getElementById("login-btn").disabled=true;
  pinBuffer=""; updatePinDots();
};

function showApp() {
  document.getElementById("login-screen").style.display="none";
  document.getElementById("loading").style.display="flex"; // show loading while Firebase connects
  document.getElementById("user-badge").textContent=me;
  buildTabs();
  subscribeDb();
}

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function confetti() {
  const canvas = document.getElementById("confetti-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const colors=["#f5c842","#3d8bff","#00c853","#ff3d57","#ff9800","#00bcd4","#9c27b0","#fff"];
  const pieces = Array.from({length:140},()=>({
    x:Math.random()*canvas.width, y:-20,
    vx:(Math.random()-0.5)*6, vy:Math.random()*5+2,
    color:colors[Math.floor(Math.random()*colors.length)],
    w:Math.random()*9+4, h:Math.random()*6+3,
    rot:Math.random()*360, vr:(Math.random()-0.5)*12,
  }));
  let frame=0;
  const draw=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=0.06;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(++frame<200) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  };
  draw();
}

function showToast(msg) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildLogin();
document.getElementById("loading").style.display = "none"; // always hide loading first
const saved = localStorage.getItem("qe_user");
const authed = sessionStorage.getItem("qe_auth");
if(saved && MEMBERS.includes(saved) && authed === saved) {
  me = saved;
  document.getElementById("login-screen").style.display="none";
  showApp();
} else {
  if(saved) localStorage.removeItem("qe_user");
  document.getElementById("login-screen").style.display="flex";
}
</script>
